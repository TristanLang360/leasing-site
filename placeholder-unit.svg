<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder for units without photos: Maison Noir palette, gold line-art greystone facade -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1c1a17"/>
      <stop offset="0.55" stop-color="#121214"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#c9a96e" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#c9a96e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <rect width="1200" height="1500" fill="url(#glow)"/>
  <rect x="40" y="40" width="1120" height="1420" fill="none" stroke="#c9a96e" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Greystone facade -->
  <g fill="none" stroke="#c9a96e" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round" transform="translate(0,-140)">
    <path d="M330 1090 V470 H870 V1090"/>
    <path d="M310 470 H890 M318 452 H882 M330 470 L340 452 M870 470 L860 452"/>
    <path d="M330 520 H870" stroke-opacity="0.25"/>
    <!-- three floors of arched windows -->
    <g stroke-opacity="0.5">
      <path d="M390 680 V590 A45 45 0 0 1 480 590 V680 Z M555 680 V590 A45 45 0 0 1 645 590 V680 Z M720 680 V590 A45 45 0 0 1 810 590 V680 Z"/>
      <path d="M390 860 V770 A45 45 0 0 1 480 770 V860 Z M555 860 V770 A45 45 0 0 1 645 770 V860 Z M720 860 V770 A45 45 0 0 1 810 770 V860 Z"/>
      <path d="M380 690 H490 M545 690 H655 M710 690 H820 M380 870 H490 M545 870 H655 M710 870 H820"/>
    </g>
    <!-- door, steps, wrought-iron balcony -->
    <path d="M560 1090 V975 A40 40 0 0 1 640 975 V1090" stroke-opacity="0.6"/>
    <path d="M520 1090 H680 M535 1070 H665 M548 1050 H652" stroke-opacity="0.35"/>
    <path d="M370 940 H830 M370 940 V905 M830 940 V905 M370 905 H830" stroke-opacity="0.4"/>
    <path d="M400 905 V940 M430 905 V940 M460 905 V940 M490 905 V940 M520 905 V940 M680 905 V940 M710 905 V940 M740 905 V940 M770 905 V940 M800 905 V940" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M250 1090 H950" stroke-opacity="0.35"/>
  </g>

  <!-- Wordmark + caption -->
  <text x="600" y="1095" text-anchor="middle" fill="#f3eee4" fill-opacity="0.9"
        font-family="Marcellus, 'Didot', 'Bodoni 72', Georgia, 'Times New Roman', serif"
        font-size="64" letter-spacing="22">RENTALIUM</text>
  <path d="M520 1135 H680" stroke="#c9a96e" stroke-opacity="0.6" stroke-width="2"/>
  <text x="600" y="1190" text-anchor="middle" fill="#c9a96e"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="9">PHOTOS À VENIR</text>
  <text x="600" y="1236" text-anchor="middle" fill="#a39e93"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" letter-spacing="8">PHOTOS COMING SOON</text>
</svg>
