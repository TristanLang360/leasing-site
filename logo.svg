<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none" role="img" aria-label="Rentalium">
  <!-- House icon (scaled to fit 48px height from 100x100 viewBox) -->
  <g transform="translate(0,4) scale(0.40)">
    <!-- Roof -->
    <polyline points="10,48 50,12 90,48" stroke="#000" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Walls -->
    <rect x="16" y="46" width="68" height="44" rx="2" stroke="#000" stroke-width="7.5"/>
    <!-- Window (3 panes) -->
    <rect x="23" y="56" width="29" height="19" rx="1.5" stroke="#000" stroke-width="5"/>
    <line x1="32" y1="56" x2="32" y2="75" stroke="#000" stroke-width="4"/>
    <line x1="41" y1="56" x2="41" y2="75" stroke="#000" stroke-width="4"/>
    <!-- Door -->
    <rect x="58" y="63" width="19" height="27" rx="2" stroke="#000" stroke-width="5"/>
  </g>
  <!-- Wordmark -->
  <text x="48" y="33"
    font-family="'DM Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-weight="600"
    font-size="26"
    letter-spacing="-0.3"
    fill="#000">Rentalium</text>
</svg>
